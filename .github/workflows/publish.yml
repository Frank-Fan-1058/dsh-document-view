name: Publish to npm

# Trusted publishing: no NPM_TOKEN secret, no token expiry.
# npm verifies this workflow's OIDC identity instead.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for the OIDC handshake

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # setup-node ships npm 10.x, which predates OIDC trusted publishing.
      # npm >= 11.5.1 is required or the publish silently goes unauthenticated
      # and the registry answers 404 instead of a credential error.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11.6.0
          npm --version
          test "$(npm --version | cut -d. -f1)" -ge 11

      # Fail fast if the committed client.js is stale or a secret slipped in.
      - name: Verify
        run: node scripts/verify.mjs

      - name: Publish
        run: npm publish --access public --provenance
